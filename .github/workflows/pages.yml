# Publiceert de site en haalt elk uur het weer op als weather.json,
# zodat ook het wandscherm (Android 5) het weer kan laden via github.io.
name: Site en weer publiceren

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Site klaarzetten en weer ophalen
        timeout-minutes: 5
        run: |
          mkdir _site
          cp index.html test.html spin-tune.m4a README.md _site/
          URL=$(grep -o "https://api.open-meteo.com/v1/forecast?[^']*" index.html | head -1)
          echo "$URL"
          if curl -sSf --connect-timeout 15 --max-time 45 --retry 2 -o w.json "$URL" && python3 -c "import json;d=json.load(open('w.json'));assert d['current'] and (d.get('daily') or d.get('hourly'));print('weer', d['current'])"; then
            mv w.json _site/weather.json
          else
            echo "::warning::Weer ophalen mislukt; site wordt zonder nieuw weather.json gepubliceerd"
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
